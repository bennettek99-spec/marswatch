[project]
name = "marswatch"
version = "0.1.0"
description = "MARSWATCH: Mars orbital surface change detection using public NASA HiRISE data"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "psutil>=5.9",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "pillow>=10",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8"]

[project.scripts]
marswatch = "marswatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marswatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that require internet access to NASA/USGS archives"]
